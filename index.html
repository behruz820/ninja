<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ninja Game - Mavsumlar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #020617;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
            border: 2px solid #1e293b;
            border-radius: 14px;
            overflow: hidden;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(2, 6, 23, 0.98);
            z-index: 10;
            padding: 24px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .logo-title {
            font-size: clamp(2.2rem, 4.5vw, 3.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 12px;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(56, 189, 248, 0.45);
        }
        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 25px;
        }
        .btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: 1px solid #3b82f6;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.1s, box-shadow 0.15s;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
            width: 280px;
            z-index: 20;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.7);
        }
        .btn-secondary {
            background: #334155;
            border-color: #475569;
            box-shadow: none;
            width: 200px;
            padding: 10px 20px;
            font-size: 0.95rem;
        }

        /* Season Grid */
        .season-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 380px;
            margin-bottom: 20px;
            z-index: 20;
        }
        .season-card {
            background: #1e293b;
            color: #38bdf8;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 16px;
            font-weight: bold;
            font-size: 1.15rem;
            cursor: pointer;
            transition: 0.2s;
            z-index: 20;
        }
        .season-card:hover {
            border-color: #38bdf8;
            background: #273549;
            transform: translateY(-2px);
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .hud-item {
            background: rgba(15, 23, 42, 0.85);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        
        #touch-controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 6;
            pointer-events: none;
        }
        .touch-group {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        .t-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(148, 163, 184, 0.5);
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .t-btn:active {
            background: rgba(56, 189, 248, 0.7);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- Main Menu -->
        <div id="main-menu" class="screen">
            <div class="logo-title">NINJA GAME</div>
            <div class="subtitle">MAVZUVIY MAVSUMLAR REJIMI</div>
            <button type="button" class="btn" onclick="openSeasonMenu()">MAVSUMLARNI BOSHLASH</button>
        </div>

        <!-- Season Select Menu -->
        <div id="season-menu" class="screen hidden">
            <div class="logo-title" style="font-size: 2rem; margin-bottom: 20px;">MAVSUMLAR</div>
            <div class="season-grid">
                <button type="button" class="season-card" onclick="startSeason(1)">🌟 1-Mavsum</button>
                <button type="button" class="season-card" onclick="startSeason(2)">🔥 2-Mavsum</button>
                <button type="button" class="season-card" onclick="startSeason(3)">⚡ 3-Mavsum</button>
                <button type="button" class="season-card" onclick="startSeason(4)">💎 4-Mavsum</button>
                <button type="button" class="season-card" onclick="startSeason(5)">👑 5-Mavsum</button>
            </div>
            <button type="button" class="btn btn-secondary" onclick="backToMenu()">◀ ORQAGA</button>
        </div>

        <!-- Game Over / Win Screen -->
        <div id="gameover-screen" class="screen hidden">
            <div id="go-title" class="logo-title">MAVSUM BOSQICHI YAKUNLANDI!</div>
            <div id="go-text" class="subtitle">Ajoyib natija!</div>
            <button type="button" class="btn" onclick="nextSeasonLevel()">KEYINGI BOSQICH</button>
            <button type="button" class="btn btn-secondary" onclick="openSeasonMenu()">MAVSUMLARGA QAYTISH</button>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="hud-item" id="hud-season">MAVSUM: 1</div>
            <div class="hud-item" id="hud-coins" style="color: #facc15;">OLTINLAR: 0 / 3</div>
        </div>

        <!-- Touch Controls -->
        <div id="touch-controls" class="hidden">
            <div class="touch-group">
                <button type="button" class="t-btn" data-key="ArrowLeft">◀</button>
                <button type="button" class="t-btn" data-key="ArrowRight">▶</button>
            </div>
            <div class="touch-group">
                <button type="button" class="t-btn" data-key="KeyX" style="border-color:#38bdf8;">⚔️</button>
                <button type="button" class="t-btn" data-key="Space" style="border-color:#facc15;">▲</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="900" height="506"></canvas>
    </div>

    <script>
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');

        var gameState = 'MENU';
        var currentSeason = 1;
        var seasonLevel = 1;
        var keys = {};

        var ninja = {
            x: 100, y: 300, w: 36, h: 54,
            vx: 0, vy: 0, speed: 6, jumpForce: -13,
            grounded: false, dir: 1, swordAnim: 0, isAttacking: false
        };

        var levelData = {
            platforms: [],
            coins: [],
            portal: { x: 800, y: 350, w: 40, h: 60 }
        };

        var scoreCoins = 0;
        var totalCoinsInLevel = 3;

        function buildSeasonMap(season, lvl) {
            currentSeason = season;
            seasonLevel = lvl;
            scoreCoins = 0;
            ninja.x = 80;
            ninja.y = 300;
            ninja.vx = 0;
            ninja.vy = 0;

            levelData.platforms = [
                { x: 0, y: 440, w: 900, h: 66 },
            ];

            var seed = (season * 50) + (lvl * 13);
            var platCount = 4 + (lvl % 5);
            for (var i = 0; i < platCount; i++) {
                var pw = 110 - (lvl % 20);
                var px = 140 + (i * 150) % 700;
                var py = 320 - ((i * 40 + seed) % 210);
                levelData.platforms.push({ x: px, y: py, w: pw, h: 18 });
            }

            levelData.coins = [
                { x: 240, y: 210, collected: false },
                { x: 480, y: 150, collected: false },
                { x: 700, y: 90, collected: false }
            ];
            totalCoinsInLevel = levelData.coins.length;

            levelData.portal = { x: 820, y: 370 - (lvl % 80), w: 40, h: 70 };
            updateHUDText();
        }

        function openSeasonMenu() {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('touch-controls').classList.add('hidden');
            document.getElementById('season-menu').classList.remove('hidden');
            gameState = 'MENU';
        }

        function startSeason(season) {
            document.getElementById('season-menu').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('touch-controls').classList.remove('hidden');
            
            buildSeasonMap(season, 1);
            gameState = 'PLAYING';
            requestAnimationFrame(gameLoop);
        }

        function nextSeasonLevel() {
            seasonLevel++;
            if (seasonLevel > 5) {
                currentSeason = currentSeason < 5 ? currentSeason + 1 : 1;
                seasonLevel = 1;
            }
            startSeason(currentSeason);
        }

        function backToMenu() {
            document.getElementById('season-menu').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('touch-controls').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            gameState = 'MENU';
        }

        function updateHUDText() {
            document.getElementById('hud-season').innerText = currentSeason + '-Mavsum (Bosqich: ' + seasonLevel + ')';
            document.getElementById('hud-coins').innerText = 'OLTINLAR: ' + scoreCoins + ' / ' + totalCoinsInLevel;
        }

        window.addEventListener('keydown', function(e) {
            keys[e.code] = true;
            if (e.code === 'Space' && ninja.grounded && gameState === 'PLAYING') {
                ninja.vy = ninja.jumpForce;
                ninja.grounded = false;
            }
            if ((e.code === 'KeyX' || e.code === 'KeyJ') && gameState === 'PLAYING') {
                ninja.isAttacking = true;
                ninja.swordAnim = 15;
            }
        });
        window.addEventListener('keyup', function(e) { keys[e.code] = false; });

        document.querySelectorAll('.t-btn').forEach(function(btn) {
            var code = btn.getAttribute('data-key');
            var press = function(e) {
                e.preventDefault();
                keys[code] = true;
                if (code === 'Space' && ninja.grounded && gameState === 'PLAYING') {
                    ninja.vy = ninja.jumpForce;
                    ninja.grounded = false;
                }
                if (code === 'KeyX' && gameState === 'PLAYING') {
                    ninja.isAttacking = true;
                    ninja.swordAnim = 15;
                }
            };
            var release = function(e) {
                e.preventDefault();
                keys[code] = false;
            };
            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
        });

        function update() {
            if (gameState !== 'PLAYING') return;

            if (keys['ArrowLeft'] || keys['KeyA']) {
                ninja.vx = -ninja.speed;
                ninja.dir = -1;
            } else if (keys['ArrowRight'] || keys['KeyD']) {
                ninja.vx = ninja.speed;
                ninja.dir = 1;
            } else {
                ninja.vx = 0;
            }

            ninja.vy += 0.55;
            ninja.x += ninja.vx;
            ninja.y += ninja.vy;

            if (ninja.swordAnim > 0) ninja.swordAnim--;
            else ninja.isAttacking = false;

            ninja.grounded = false;
            levelData.platforms.forEach(function(p) {
                if (ninja.x + ninja.w > p.x && ninja.x < p.x + p.w &&
                    ninja.y + ninja.h >= p.y && ninja.y + ninja.h <= p.y + p.vy + 12 && ninja.vy >= 0) {
                    ninja.y = p.y - ninja.h;
                    ninja.vy = 0;
                    ninja.grounded = true;
                }
            });

            if (ninja.x < 0) ninja.x = 0;
            if (ninja.x + ninja.w > canvas.width) ninja.x = canvas.width - ninja.w;
            if (ninja.y > canvas.height) {
                buildSeasonMap(currentSeason, seasonLevel);
            }

            levelData.coins.forEach(function(c) {
                if (!c.collected && Math.hypot((ninja.x + ninja.w/2) - (c.x + 12), (ninja.y + ninja.h/2) - (c.y + 12)) < 30) {
                    c.collected = true;
                    scoreCoins++;
                    updateHUDText();
                }
            });

            var pr = levelData.portal;
            if (scoreCoins >= totalCoinsInLevel &&
                ninja.x < pr.x + pr.w && ninja.x + ninja.w > pr.x &&
                ninja.y < pr.y + pr.h && ninja.y + ninja.h > pr.y) {
                
                gameState = 'WIN';
                document.getElementById('hud').classList.add('hidden');
                document.getElementById('touch-controls').classList.add('hidden');
                document.getElementById('gameover-screen').classList.remove('hidden');
                document.getElementById('go-title').innerText = currentSeason + '-MAVSUM BOSQICHI YAKUNLANDI!';
                document.getElementById('go-text').innerText = 'Keyingi bosqichga o\'ting!';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.arc(780, 90, 35, 0, Math.PI * 2);
            ctx.fill();

            levelData.platforms.forEach(function(p) {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            });

            levelData.coins.forEach(function(c) {
                if (!c.collected) {
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(c.x + 12, c.y + 12, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ca8a04';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });

            var pr = levelData.portal;
            ctx.fillStyle = scoreCoins >= totalCoinsInLevel ? '#38bdf8' : '#475569';
            ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.strokeRect(pr.x, pr.y, pr.w, pr.h);

            // Ninja
            ctx.save();
            ctx.translate(ninja.x + ninja.w / 2, ninja.y + ninja.h / 2);
            if (ninja.dir === -1) ctx.scale(-1, 1);
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-14, -15, 28, 38);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.strokeRect(-14, -15, 28, 38);
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-16, -34, 32, 24);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(2, -28, 8, 5);
            if (ninja.isAttacking) {
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(14, -5);
                ctx.lineTo(38, -15);
                ctx.stroke();
            }
            ctx.restore();
        }

        function gameLoop() {
            if (gameState === 'PLAYING') {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }
    </script>
</body>
</html>
